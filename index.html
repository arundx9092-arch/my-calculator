<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; }
    .calculator { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #display { width: 100%; height: 60px; background: #0f172a; color: #fff; text-align: right; font-size: 2rem; border: none; border-radius: 8px; padding: 12px; margin-bottom: 20px; outline: none; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button { padding: 16px; font-size: 1.25rem; font-weight: bold; border: none; border-radius: 8px; background: #334155; color: #fff; cursor: pointer; transition: 0.1s; }
    button:active { transform: scale(0.95); background: #475569; }
    button.op { background: #f59e0b; color: #000; }
    button.clear { background: #ef4444; color: #fff; }
    button.equal { background: #10b981; color: #fff; grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly placeholder="0">
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')" class="op">÷</button>
      <button onclick="appendValue('*')" class="op">×</button>
      <button onclick="deleteLast()" class="op">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')" class="op">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('+')" class="op">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }
    function deleteLast() { display.value = display.value.slice(0, -1); }
    function calculate() {
      try {
        if (display.value) display.value = Function('"use strict";return (' + display.value + ')')();
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
